</style><script type="module">
function dayKey(date=new Date()) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function days(now=new Date()) { return Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-i);return dayKey(d);}); }
function priority(records,now=new Date()) {
  const week=days(now); let count=0,recency=0;
  week.forEach((day,i)=>{if(records.includes(day)){count++;recency+=7-i;}});
  return 1-(count+recency/56)/7.5;
}
function shares(weights) {
  const n=weights.length;if(!n)return [];
  const total=Math.min(1,n/3),floor=Math.min(.045,total/n),cap=1/3;
  let result=Array(n).fill(floor),remaining=total-floor*n,active=weights.map((_,i)=>i);
  while(remaining>1e-9&&active.length){
    const sum=active.reduce((s,i)=>s+weights[i],0),over=active.filter(i=>result[i]+remaining*weights[i]/sum>cap);
    if(!over.length){active.forEach(i=>{result[i]+=remaining*weights[i]/sum;});break;}
    for(const i of over){remaining-=cap-result[i];result[i]=cap;}active=active.filter(i=>!over.includes(i));
  }
  return result;
}
function layout(items,x,y,w,h,result=[]) {
  if(!items.length)return result;
  if(items.length===1){result.push({...items[0],x,y,w,h});return result;}
  const middle=Math.ceil(items.length/2),a=items.slice(0,middle),b=items.slice(middle);
  const sum=list=>list.reduce((s,i)=>s+i.area,0),fraction=sum(a)/sum(items);
  if(w>h){layout(a,x,y,w*fraction,h,result);layout(b,x+w*fraction,y,w*(1-fraction),h,result);}
  else {layout(a,x,y,w,h*fraction,result);layout(b,x,y+h*fraction,w,h*(1-fraction),result);}
  return result;
}

const $=id=>document.getElementById(id),KEY='magic-study:v1';
const names=['专业课','高等数学','英语阅读','思想政治','线性代数','概率统计','英语单词','英语写作','专业练习'];
const fresh=()=>({version:1,started:false,subjects:names.map((name,i)=>({id:`subject-${i}`,name,records:[]}))});
const valid=s=>s&&s.version===1&&Array.isArray(s.subjects)&&s.subjects.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.records)&&x.records.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)));
let state=fresh(),storageProblem=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else storageProblem=true;}}catch{storageProblem=true;}
let demo=!state.started,editing=false,editingId=null,toastTimer,undoAction=null,today=dayKey(),midnightTimer;
function sample(){const week=days();const offsets=[[],[2],[1,3],[1,2,4],[1,2,3,5],[1,2,3,4],[1,2,3,4,5,6],[1,2,3,4,5],[2,3,4,5]];return names.map((name,i)=>({id:`demo-${i}`,name,records:offsets[i].map(d=>week[d])}));}
let demoSubjects=sample();
const subjects=()=>demo?demoSubjects:state.subjects;
function notify(text,action=null){clearTimeout(toastTimer);undoAction=action;$('toastText').textContent=text;$('undo').hidden=!action;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true;undoAction=null;},action?6500:4000);}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true;}catch{notify('暂时无法保存，请检查浏览器的存储设置。');return false;}}
function updateSubjects(next){if(demo){demoSubjects=next;return true;}return commit({...state,subjects:next});}
function color(p){const stops=[[145,215,171],[243,216,127],[255,126,114]];const t=Math.min(1,Math.max(0,p))*2,k=Math.min(1,Math.floor(t)),f=t-k;return `rgb(${stops[k].map((v,i)=>Math.round(v+(stops[k+1][i]-v)*f)).join(',')})`;}
function render(){
  const list=subjects(),board=$('board');board.classList.toggle('editing',editing);board.classList.toggle('empty',!list.length);
  $('edit').textContent=editing?'完成':'编辑';$('edit').classList.toggle('active',editing);$('demoBadge').hidden=!demo;
  $('footerText').textContent=editing?'点科目，修改名称或删除。':demo?'示例记录 · 先点点看':'学完，轻轻点一下。';
  $('footerAction').textContent=demo?'开始记录':'怎么用';$('footerAction').classList.toggle('start',demo);
  if(!list.length){board.replaceChildren();const box=document.createElement('div');box.className='empty-content';box.textContent='从一个科目开始。';const add=document.createElement('button');add.textContent='添加科目';add.onclick=()=>openSubject();box.append(add);board.append(box);return;}
  board.querySelector('.empty-content')?.remove();
  const validIds=new Set(list.map(s=>s.id));board.querySelectorAll('.subject').forEach(el=>{if(!validIds.has(el.dataset.id))el.remove();});
  const weights=list.map(s=>Math.exp(priority(s.records)*3.4)),areas=shares(weights),sum=areas.reduce((s,v)=>s+v,0);
  const width=board.clientWidth,height=Math.max(board.clientHeight,Math.ceil(list.length/3)*90);
  board.style.minHeight=`${Math.max(420,Math.ceil(list.length/3)*90)}px`;
  const rects=layout(list.map((s,i)=>({...s,area:areas[i]})),0,0,width,height*sum);
  const min=Math.min(...areas),max=Math.max(...areas);
  rects.forEach(item=>{
    let button=Array.from(board.children).find(el=>el.dataset.id===item.id);
    if(!button){button=document.createElement('button');button.className='subject';button.dataset.id=item.id;const tile=document.createElement('span');tile.className='tile';const name=document.createElement('span');name.className='subject-name';tile.append(name);button.append(tile);button.onclick=()=>editing?openSubject(item.id):record(item.id);board.append(button);}
    const p=max-min<.00001?.5:(item.area-min)/(max-min);
    button.style.left=`${item.x}px`;button.style.top=`${item.y}px`;button.style.width=`${item.w}px`;button.style.height=`${item.h}px`;button.style.setProperty('--color',color(p));
    const shortSide=Math.min(item.w,item.h),font=Math.max(14,Math.min(34,shortSide*.19,(item.w-38)/Math.min(item.name.length,5)));
    button.style.setProperty('--font',`${font}px`);button.querySelector('.subject-name').textContent=item.name;button.setAttribute('aria-label',`${item.name}，${editing?'编辑科目':'记录一次学习'}`);
  });
}
function record(id){
  const list=subjects(),subject=list.find(s=>s.id===id);if(!subject)return false;
  const date=dayKey();
  if(subject.records.includes(date)){notify('这次已经记下了。',()=>unrecord(id,date));return false;}
  const week=days(),next=list.map(s=>s.id===id?{...s,records:[...s.records.filter(d=>week.includes(d)),date]}:s);
  if(!updateSubjects(next))return false;render();navigator.vibrate?.(12);notify('记下一点进步。',()=>unrecord(id,date));return true;
}
function unrecord(id,date){const next=subjects().map(s=>s.id===id?{...s,records:s.records.filter(d=>d!==date)}:s);if(updateSubjects(next)){render();notify('已撤销。');}}
function start(){const next=state.started?state:{...state,subjects:demoSubjects.map(s=>({id:crypto.randomUUID(),name:s.name,records:[]}))};if(!commit({...next,started:true}))return;demo=false;editing=false;clearToast();render();}
function clearToast(){clearTimeout(toastTimer);$('toast').hidden=true;undoAction=null;}
function openSubject(id=null){editingId=id;const subject=subjects().find(s=>s.id===id);$('dialogTitle').textContent=id?'编辑科目':'添加科目';$('subjectName').value=subject?.name||'';$('deleteSubject').hidden=!id;$('fieldError').textContent='';$('subjectDialog').showModal();setTimeout(()=>$('subjectName').focus(),80);}
$('add').onclick=()=>openSubject();$('edit').onclick=()=>{editing=!editing;render();};
$('footerAction').onclick=()=>demo?start():$('helpDialog').showModal();
$('tryDemo').onclick=()=>{demo=true;demoSubjects=sample();editing=false;clearToast();$('helpDialog').close();render();};
$('undo').onclick=()=>{const action=undoAction;clearToast();action?.();};
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>button.closest('dialog').close());
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}}));
$('subjectForm').onsubmit=event=>{
  event.preventDefault();const name=$('subjectName').value.trim();if(!name){$('fieldError').textContent='写下一个科目名称。';return;}
  const list=subjects();if(list.some(s=>s.id!==editingId&&s.name===name)){$('fieldError').textContent='这个科目已经有了，换个名称吧。';return;}
  const next=editingId?list.map(s=>s.id===editingId?{...s,name}:s):[...list,{id:crypto.randomUUID(),name,records:[]}];
  if(updateSubjects(next)){$('subjectDialog').close();render();}
};
$('deleteSubject').onclick=()=>{const subject=subjects().find(s=>s.id===editingId);if(!subject)return;$('deleteCopy').textContent=`「${subject.name}」和它的学习记录会一起移除。`;$('subjectDialog').close();$('deleteDialog').showModal();};
$('confirmDelete').onclick=()=>{const previous=subjects().map(s=>({...s,records:[...s.records]}));if(updateSubjects(subjects().filter(s=>s.id!==editingId))){$('deleteDialog').close();render();notify('科目已删除。',()=>{if(updateSubjects(previous)){render();notify('已恢复。');}});}};
function refreshDay(){const next=dayKey();if(next!==today){today=next;clearToast();render();}clearTimeout(midnightTimer);const now=new Date(),tomorrow=new Date(now);tomorrow.setHours(24,0,0,50);midnightTimer=setTimeout(refreshDay,tomorrow-now);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay();});window.addEventListener('focus',refreshDay);
window.addEventListener('storage',event=>{if(event.key!==KEY)return;try{const next=event.newValue?JSON.parse(event.newValue):fresh();if(valid(next)){state=next;if(!demo)render();}}catch{}});
new ResizeObserver(()=>render()).observe($('board'));render();refreshDay();
if(storageProblem)notify('原来的记录暂时无法读取，请先保留浏览器数据。');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./magic-button-sw.js',{scope:'./magic-button.html'}).catch(()=>{}));
const context=document.modelContext;
if(context?.registerTool){
  const lifecycle=new AbortController();
  const register=tool=>{try{Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}};
  register({name:'list_study_subjects',description:'读取当前科目。demo 表示示例模式。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({demo,subjects:subjects().map(s=>({id:s.id,name:s.name,studyDays:days().filter(d=>s.records.includes(d)).length}))})});
  register({name:'record_subject_study',description:'为当前科目记录今天的一次学习，每科每天一次。示例模式仅修改示例。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input.id!=='string'||!subjects().some(s=>s.id===input.id))throw new Error('科目不存在');return {recorded:record(input.id),demo};}});
  window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}

  <dialog id="helpDialog"><div class="sheet-top"><h2>给每个科目一点时间。</h2><button class="close-button" data-close aria-label="关闭">×</button></div><div class="help-copy"><p>学完一个科目，点一下对应按钮。最近七天学得越少，它就越大、越偏红；连续学习，它就慢慢缩小、变绿。</p><div class="color-key"><span>常常学</span><i></i><span>该看看了</span></div><p>每天每科记录一次，点错可以撤销。每天零点自动向前滚动，今天和前六天一起计算。</p><p class="muted">记录只保存在当前浏览器。清除浏览器数据会移除记录，换设备不会同步。</p><details><summary>放到手机主屏幕</summary><p>在手机浏览器打开本页，从分享或浏览器菜单选择「添加到主屏幕」。</p></details></div><button id="tryDemo" class="secondary-button">体验一周的变化</button></dialog>

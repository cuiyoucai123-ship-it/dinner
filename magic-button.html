function dayKey(date=new Date()) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function days(now=new Date()) { return Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-i);return dayKey(d);}); }
function priority(records,now=new Date()) {
  const week=days(now); let count=0,recency=0;
  week.forEach((day,i)=>{if(records.includes(day)){count++;recency+=7-i;}});
  return 1-(count+recency/56)/7.5;
}
function shares(priorities,cap=1/3) {
  const n=priorities.length;if(!n)return [];
  // Leave breathing room with fewer than four subjects; the maximum stays 1/3.
  if(n<3){const base=Math.min(.1,cap*.4);return priorities.map(p=>base+(cap-base)*Math.max(0,Math.min(1,p)));}
  const total=Math.min(n===3?.84:1,n*cap*.9),floor=Math.min(.045,total*.55/n);
  const available=total-n*floor,headroom=cap-floor;
  // Bound the exponential before allocation instead of clipping the result.
  // The extreme 1-vs-0 case reaches the limit; every improvement still shrinks.
  const ceiling=headroom*(n-1)/(available-headroom);
  const curve=Math.min(3.4,Math.log(ceiling));
  const weights=priorities.map(p=>Math.exp(curve*Math.max(0,Math.min(1,p))));
  const sum=weights.reduce((a,b)=>a+b,0);
  return weights.map(weight=>floor+available*weight/sum);
}
function layout(items,x,y,w,h,result=[]) {
  if(!items.length)return result;
  if(items.length===1){
    const area=items[0].area*w*h,side=Math.sqrt(area);
    const width=Math.min(w,side),height=area/width;
    return [{...items[0],x:x+(w-width)/2,y,w:width,h:height}];
  }
  const middle=Math.ceil(items.length/2),columns=[items.slice(0,middle),items.slice(middle)];
  const total=items.reduce((sum,item)=>sum+item.area,0),filledHeight=h*total;
  let columnX=x;
  for(const column of columns){
    const columnArea=column.reduce((sum,item)=>sum+item.area,0),columnWidth=w*columnArea/total;
    let rowY=y;
    for(const item of column){const rowHeight=filledHeight*item.area/columnArea;result.push({...item,x:columnX,y:rowY,w:columnWidth,h:rowHeight});rowY+=rowHeight;}
    columnX+=columnWidth;
  }
  return result;
}

const $=id=>document.getElementById(id),KEY='magic-study:v1';
const names=['专业课','高等数学','英语阅读','思想政治','线性代数','概率统计','英语单词','英语写作','专业练习'];
const fresh=()=>({version:1,started:false,subjects:names.map((name,i)=>({id:`subject-${i}`,name,records:[]}))});

let state=fresh(),storageProblem=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else storageProblem=true;}}catch{storageProblem=true;}
let demo=!state.started,editing=false,editingId=null,toastTimer,undoAction=null,today=dayKey(),midnightTimer,historyId=null;
function sample(){const week=days();const offsets=[[],[2],[1,3],[1,2,4],[1,2,3,5],[1,2,3,4],[1,2,3,4,5,6],[1,2,3,4,5],[2,3,4,5]];return names.map((name,i)=>({id:`demo-${i}`,name,records:offsets[i].map(d=>week[d])}));}
let demoSubjects=sample();
const subjects=()=>demo?demoSubjects:state.subjects;

function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true;}catch{notify('暂时无法保存，请检查浏览器的存储设置。');return false;}}
function updateSubjects(next){if(demo){demoSubjects=next;return true;}return commit({...state,subjects:next});}
function color(p){const stops=[[145,215,171],[243,216,127],[255,126,114]];const t=Math.min(1,Math.max(0,p))*2,k=Math.min(1,Math.floor(t)),f=t-k;return `rgb(${stops[k].map((v,i)=>Math.round(v+(stops[k+1][i]-v)*f)).join(',')})`;}
function render(){
  const list=subjects(),board=$('board');board.classList.toggle('editing',editing);board.classList.toggle('empty',!list.length);
  $('edit').textContent=editing?'完成':'编辑';$('edit').classList.toggle('active',editing);$('demoBadge').hidden=!demo;
  $('footerText').textContent=editing?'点科目，修改名称或删除。':demo?'示例记录 · 先点点看':'轻点记录 · 长按补记';
  $('footerAction').textContent=demo?'开始记录':'怎么用';$('footerAction').classList.toggle('start',demo);
  if(!list.length){board.replaceChildren();const box=document.createElement('div');box.className='empty-content';box.textContent='从一个科目开始。';const add=document.createElement('button');add.textContent='添加科目';add.onclick=()=>openSubject();box.append(add);board.append(box);return;}
  board.querySelector('.empty-content')?.remove();
  const validIds=new Set(list.map(s=>s.id));board.querySelectorAll('.subject').forEach(el=>{if(!validIds.has(el.dataset.id))el.remove();});

function animatePress(id){

  button?.querySelector('.tile')?.animate([{transform:'translateY(2px) scale(.94)'},{transform:'translateY(-2px) scale(1.025)',offset:.55},{transform:'translateY(0) scale(1)'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});

function setStudy(id,date,studied){
  const list=subjects(),subject=list.find(s=>s.id===id);
  if(!subject||!days().includes(date))return false;
  const records=studied?[...new Set([...subject.records,date])]:subject.records.filter(d=>d!==date);
  const next=list.map(s=>s.id===id?{...s,records}:s);
  if(!updateSubjects(next))return false;

function record(id){
  const subject=subjects().find(s=>s.id===id);if(!subject)return false;

  if(subject.records.includes(date)){notify('这次已经记下了。',()=>unrecord(id,date));return false;}

function openHistory(id){

function start(){const next=state.started?state:{...state,subjects:demoSubjects.map(s=>({id:crypto.randomUUID(),name:s.name,records:[]}))};if(!commit({...next,started:true}))return;demo=false;editing=false;clearToast();render();}

  if(updateSubjects(next)){$('subjectDialog').close();render();}
};
$('deleteSubject').onclick=()=>{const subject=subjects().find(s=>s.id===editingId);if(!subject)return;$('deleteCopy').textContent=`「${subject.name}」和它的学习记录会一起移除。`;$('subjectDialog').close();$('deleteDialog').showModal();};
$('confirmDelete').onclick=()=>{const previous=subjects().map(s=>({...s,records:[...s.records]}));if(updateSubjects(subjects().filter(s=>s.id!==editingId))){$('deleteDialog').close();render();notify('科目已删除。',()=>{if(updateSubjects(previous)){render();notify('已恢复。');}});}};
function refreshDay(){const next=dayKey();if(next!==today){today=next;clearToast();render();if($('historyDialog').open)renderHistory();}clearTimeout(midnightTimer);const now=new Date(),tomorrow=new Date(now);tomorrow.setHours(24,0,0,50);midnightTimer=setTimeout(refreshDay,tomorrow-now);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay();});window.addEventListener('focus',refreshDay);
window.addEventListener('storage',event=>{if(event.key!==KEY)return;try{const next=event.newValue?JSON.parse(event.newValue):fresh();if(valid(next)){state=next;if(!demo){render();if($('historyDialog').open)renderHistory();}}}catch{}});
new ResizeObserver(()=>render()).observe($('board'));render();refreshDay();
if(storageProblem)notify('原来的记录暂时无法读取，请先保留浏览器数据。');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./magic-button-sw.js',{scope:'./magic-button.html'}).catch(()=>{}));
const context=document.modelContext;
if(context?.registerTool){
  const lifecycle=new AbortController();
  const register=tool=>{try{Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}};
  register({name:'list_study_subjects',description:'读取当前科目。demo 表示示例模式。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({demo,subjects:subjects().map(s=>({id:s.id,name:s.name,studyDays:days().filter(d=>s.records.includes(d)).length}))})});
  register({name:'record_subject_study',description:'为当前科目记录今天的一次学习，每科每天一次。示例模式仅修改示例。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input.id!=='string'||!subjects().some(s=>s.id===input.id))throw new Error('科目不存在');return {recorded:record(input.id),demo};}});
  window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}

</script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><img class="brand-mark" src="./magic-button-assets/magic-icon-v4-64.png" alt="" width="29" height="29"><h1>神奇按钮</h1><span class="demo-badge" id="demoBadge" hidden>体验</span></div>
      <nav aria-label="科目管理"><button class="icon-button" id="add" aria-label="添加科目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="edit-button" id="edit">编辑</button></nav>
    </header>
    <section class="board" id="board" aria-label="学习科目"></section>
    <footer class="footer"><div id="footerText" class="footer-text">轻点记录 · 长按补记</div><button id="footerAction" class="quiet-button">怎么用</button></footer>
  </main>
  <dialog id="historyDialog" aria-labelledby="historyTitle"><div class="sheet-top"><h2 id="historyTitle"></h2><button class="close-button" data-close aria-label="关闭">×</button></div><p class="history-hint">点日期，补记或取消。</p><div class="history-days" id="historyDays"></div><p class="history-summary" id="historySummary" aria-live="polite"></p><button class="primary-button history-done" data-close>完成</button></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button id="undo">撤销</button></div>
  <dialog id="subjectDialog"><form id="subjectForm"><div class="sheet-top"><h2 id="dialogTitle">添加科目</h2><button class="close-button" type="button" data-close aria-label="关闭">×</button></div><label for="subjectName">科目名称</label><input id="subjectName" name="name" maxlength="24" required autocomplete="off" placeholder="例如：英语阅读"><p class="field-error" id="fieldError" role="alert"></p><div class="sheet-actions"><button id="deleteSubject" class="delete-button" type="button" hidden>删除科目</button><button id="viewHistory" class="history-link" type="button" hidden>七天记录</button><button class="primary-button" type="submit">保存</button></div></form></dialog>
  <dialog id="helpDialog"><div class="sheet-top"><h2>给每个科目一点时间。</h2><button class="close-button" data-close aria-label="关闭">×</button></div><div class="help-copy"><p>学完一个科目，点一下对应按钮。最近七天学得越少，它就越大、越偏红；连续学习，它就慢慢缩小、变绿。</p><div class="color-key"><span>常常学</span><i></i><span>该看看了</span></div><p>每天每科记录一次，点错可以撤销。长按科目，可以查看最近七天，补记或取消某一天。每天零点自动向前滚动。</p><p class="muted">记录只保存在当前浏览器。清除浏览器数据会移除记录，换设备不会同步。</p><details><summary>放到手机主屏幕</summary><p>在手机浏览器打开本页，从分享或浏览器菜单选择「添加到主屏幕」。</p></details></div><button id="tryDemo" class="secondary-button">体验一周的变化</button></dialog>
  <dialog id="deleteDialog"><div class="sheet-top"><h2>删除这个科目？</h2><button class="close-button" data-close aria-label="关闭">×</button></div><p class="help-copy" id="deleteCopy"></p><div class="sheet-actions"><button class="secondary-button" data-close>保留</button><button class="danger-button" id="confirmDelete">删除</button></div></dialog>
  <noscript>请开启 JavaScript，以使用神奇按钮。</noscript>
</body>
</html>

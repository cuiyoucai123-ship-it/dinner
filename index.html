<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日饭单</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日饭单">
<meta name="theme-color" content="#EEF4E8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --ink:#234332; --muted:#66796C; --leaf:#355D43; --line:#DBE5D8; --paper:#FBFCF7; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; color:var(--ink); background:#EEF4E8; }
  button,input,textarea { font:inherit; }
  button { color:inherit; cursor:pointer; }
  button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--leaf); outline-offset:3px; }
  .app { width:min(100%,560px); margin:auto; padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 20px); }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 9px; }
  h1 { margin:0; font-size:25px; line-height:1.25; letter-spacing:-.6px; }
  .date { margin-top:3px; color:var(--muted); font-size:12px; }
  .today-button { min-height:44px; padding:0 10px; border:0; border-radius:12px; background:#E0EBDC; font-size:12px; }
  .week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:10px; }
  .day-button { min-width:0; min-height:44px; padding:5px 0; border:0; border-radius:12px; background:transparent; color:var(--muted); font-size:13px; }
  .day-button span { display:block; font-size:9px; line-height:12px; }
  .day-button.active { background:var(--leaf); color:white; font-weight:700; }
  .meal-card { margin-bottom:10px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--paper); box-shadow:0 3px 14px rgba(50,80,58,.035); }
  .card-head { display:flex; align-items:center; gap:8px; padding:5px 12px 0; }
  .meal-icon { display:grid; width:28px; height:28px; place-items:center; border-radius:10px; background:#E7EFE2; font-size:16px; }
  h2 { display:inline; margin:0; font-size:16px; }
  .card-subtitle { margin-left:7px; font-size:11px; color:var(--muted); }
  .head-copy { flex:1; min-width:0; }
  .edit-button { width:44px; height:44px; margin-left:auto; border:0; background:transparent; color:var(--muted); font-size:12px; }
  .done-button { flex-shrink:0; min-width:52px; min-height:44px; padding:0 4px; border:0; background:transparent; color:var(--leaf); font-size:12px; font-weight:650; }
  .done-button:active { background:#E4EDDF; border-radius:10px; }
  .completed-meals { display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin:3px 2px; color:var(--muted); font-size:11px; }
  .restore-button { min-height:44px; padding:0 9px; border:0; background:transparent; color:var(--leaf); font-size:12px; text-decoration:underline; text-underline-offset:3px; }
  .day-finished { padding:34px 12px 24px; text-align:center; }
  .day-finished strong { display:block; margin-bottom:8px; font-size:18px; }
  .day-finished p { margin:0; color:var(--muted); font-size:12px; }
  .food-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 16px; padding:2px 14px 9px; }
  .food-item { display:flex; justify-content:space-between; align-items:baseline; gap:5px; min-width:0; line-height:1.4; }
  .food-name { min-width:0; font-size:13px; overflow-wrap:anywhere; }
  .food-amount { max-width:55%; flex-shrink:0; font-size:12px; font-weight:650; overflow-wrap:anywhere; text-align:right; }
  .meal-steps { margin:0 14px 11px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:11.5px; line-height:1.65; white-space:pre-line; overflow-wrap:anywhere; }
  .prep-note { margin:0 12px 10px; padding:8px 10px; background:#E8F0E2; border-radius:10px; color:var(--leaf); font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
  .evening { margin:0 14px 11px; padding-top:8px; border-top:1px solid var(--line); }
  .evening-label { display:block; margin-bottom:5px; color:var(--muted); font-size:11px; }
  .evening .food-list { padding:0; }
  .snack-card { background:#F9FAF3; }
  .snack-card .meal-icon { background:#F4EBDD; }
  .empty-card { grid-column:1/-1; color:var(--muted); font-size:12px; }
  .weight-note { margin:7px 3px 0; color:var(--muted); font-size:10px; line-height:1.5; }
  .edit-page { padding-bottom:90px; }
  .edit-topbar { display:flex; align-items:center; gap:10px; margin-bottom:15px; }
  .back-button { flex-shrink:0; width:44px; height:44px; border:0; border-radius:12px; background:var(--paper); font-size:25px; }
  .edit-heading { font-size:20px; font-weight:700; }
  .edit-help { margin-top:4px; font-size:12px; color:var(--muted); }
  .edit-section-title { display:block; margin:18px 0 9px; font-size:14px; font-weight:650; }
  .edit-item { display:grid; grid-template-columns:minmax(0,1fr) 90px 44px; align-items:center; gap:7px; margin-bottom:8px; }
  input,textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); font-size:16px; }
  input { height:44px; min-width:0; padding:0 10px; }
  textarea { min-height:120px; padding:11px; resize:vertical; line-height:1.6; }
  .delete-button { width:44px; height:44px; border:0; border-radius:10px; background:#F7E6E0; color:#9B4A3F; font-size:20px; }
  .add-button { width:100%; min-height:44px; margin:2px 0 6px; border:1px dashed #A7BBA5; border-radius:11px; background:transparent; font-size:14px; }
  .reset-button { min-height:44px; margin-top:12px; border:0; background:transparent; color:#9B4A3F; font-size:13px; }
  .storage-help { margin-top:10px; color:var(--muted); font-size:12px; line-height:1.6; }
  .save-bar { position:fixed; bottom:0; left:0; right:0; padding:10px 14px calc(env(safe-area-inset-bottom) + 10px); background:rgba(238,244,232,.94); backdrop-filter:blur(12px); }
  .save-button { display:block; width:min(100%,532px); min-height:48px; margin:auto; border:0; border-radius:13px; background:var(--leaf); color:white; font-weight:650; }
  .toast { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 76px); left:50%; z-index:10; max-width:90%; width:max-content; padding:10px 14px; border-radius:12px; background:#234332; color:white; font-size:13px; opacity:0; pointer-events:none; transform:translateX(-50%); transition:opacity .15s; }
  .toast.show { opacity:1; }
  @media (max-width:360px) { .app { padding-left:10px; padding-right:10px; } .food-list { gap:7px 12px; } .edit-item { grid-template-columns:minmax(0,1fr) 80px 44px; } }
</style>
<script src="plan-migration.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="app" class="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
